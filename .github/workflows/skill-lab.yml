name: Skill lab

# skill_lab/ is the Skill-vs-Luck layer: control baselines (market benchmark,
# random 50/50 picks, favourites-only) and benchmark-relative Brier skill with a
# game-cluster bootstrap confidence interval and a Benjamini-Hochberg multiplicity
# adjustment. It answers readiness requirements C03 (rank by proper score with
# uncertainty, not win rate) and C04 (add a control baseline to every leaderboard
# run).
#
# The build reads the pinned, already-verified inputs (line_lab/data/derived/bets.csv
# and market_lab/data/results_feed.csv). It is deterministic under SOURCE_DATE_EPOCH:
# no network, no clock, no randomness beyond a fixed seed, so the committed pages
# must be exactly reproducible from the committed data.
#
# check.py is fail-closed. It exits non-zero if a page is missing, if a data-table
# row carries no source link, if an external link is off the verified allow-list, if
# a published count disagrees with the data files, if BSS != Brier(model) - Brier(market),
# if the skill ranks are not a permutation, if the BH q-values disagree with the
# published p-values, or if a control baseline is malformed.
#
# The job is named after the directory rather than "verify": several workflows in this
# repository already use the job name "verify", and `gh pr checks` lists job names.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DATE_EPOCH: "1767225600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Rebuild the Skill Lab from the pinned inputs
        run: python3 -m skill_lab.build

      - name: Enforce sourcing, verification, number agreement and determinism
        run: python3 -m skill_lab.check --determinism

      - name: Fail if generated output differs from committed output
        run: git diff --exit-code -- skill_lab/

      - name: Classify the source of every table row repository-wide
        run: python3 verify/source_audit.py --max-unsourced 0 --allow-dirs session-398c4b58,qa

      - name: Resolve every local link on every published page
        run: python3 verify/linkcheck_all.py
