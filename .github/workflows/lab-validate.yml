name: Verified workbench

on:
  push:
    branches: [main, arena/cbcd97cc-korea3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (synthetic fixtures only)
        run: python -m pytest tests/test_lab_*.py -q
      - name: Rebuild fail-closed verified dashboard
        run: python -m nfl_lab.run
      - name: Check official row sources, local links and blank-value discipline
        run: python -m nfl_lab.check_verified
      - name: Fail if generated verified output differs from committed output
        run: git diff --exit-code -- verified nfl_lab
      - name: Upload verified status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-workbench-status
          path: verified/data/status.json
