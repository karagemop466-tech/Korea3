name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy pandas scipy
      - name: Verify site and data
        run: |
          if python3 scripts/verify_site.py > /tmp/verify_site.out 2>&1; then
            cat /tmp/verify_site.out
          else
            cat /tmp/verify_site.out
            echo "::error title=verify: site/data verification failed::$(grep -m4 '^FAIL' /tmp/verify_site.out | tr '\n' ' | ' | cut -c1-800)"
            exit 1
          fi
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: data/derived/verification_report.json
