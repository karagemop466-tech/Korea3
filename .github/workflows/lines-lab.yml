name: Line origination lab

# lines_lab/ originates its own NFL side, total and moneyline numbers from the pinned nflverse
# dataset, then tries to disprove them: walk-forward fair-line error against the market, eighteen
# pre-registered rules under Bonferroni multiplicity control, a leaderboard that keeps signal and
# staking in separate columns, and a fail-closed demotion gate.
#
# The build is deterministic. It reads no clock, touches no network and uses no randomness, so the
# committed HTML must be exactly reproducible from the committed data. check.py is fail-closed: it
# exits non-zero if a table row carries no source link, a local link does not resolve, a cell renders
# a raw None/nan, a dataset checksum has changed, a headline number does not recompute, or two
# consecutive builds differ by a byte.
#
# The job is named after the directory rather than "verify": several workflows in this repository
# already use the job name "verify", and `gh pr checks` lists job names, so another would be
# untraceable without opening each run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lines-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild every Line Origination Lab page from the pinned dataset
        run: python3 lines_lab/build.py

      - name: Enforce sourcing, link resolution, checksums, recomputation and determinism
        run: python3 lines_lab/check.py

      - name: Fail if generated output differs from committed output
        run: git diff --exit-code -- lines_lab

      - name: Regenerate the root dashboard so the new section is linked
        run: python3 line_lab/build_site.py

      - name: Fail if the root dashboard drifted
        run: git diff --exit-code -- '*.html'

      - name: Classify the source of every table row repository-wide
        # Rows in two other sessions' archives (session-398c4b58/, qa/) are non-numeric and are
        # reported on the site rather than excused; they are counted, not gated.
        run: python3 verify/source_audit.py --max-unsourced 0 --allow-dirs session-398c4b58,qa

      - name: Resolve every local link on every published page
        run: python3 verify/linkcheck_all.py
