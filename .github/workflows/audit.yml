name: Audit

# Repository-wide audit. The other workflows each check one session's directory; this one checks the
# union of everything GitHub Pages serves, re-derives the published headline numbers independently of
# the pipeline that produced them, and classifies the source of every table row.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy

      - name: Re-derive every published headline number from the raw snapshot
        run: python3 verify/recompute_claims.py

      - name: Resolve every local link on every published page
        run: python3 verify/linkcheck_all.py

      - name: Every table row in this repository's own builds must carry a source
        # Rows in two other sessions' archives (session-398c4b58/, qa/) are non-numeric and are
        # reported on the site rather than excused; they are counted, not gated.
        run: python3 verify/source_audit.py --max-unsourced 0 --allow-dirs session-398c4b58,qa

      - name: The dashboard's own gate must still pass
        run: python3 line_lab/check_site.py
