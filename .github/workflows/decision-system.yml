name: Decision system

# This workflow is the only place the pinned nflverse release assets can actually be
# downloaded: the analysis sandbox cannot reach release-assets.githubusercontent.com, and
# a GitHub token makes the asset API reliable.  It therefore does the full job — fetch and
# hash, compute the injury/depth tables, audit the strategies, rebuild the site, and fail
# on any drift or verification problem.

on:
  push:
    branches: [main, arena/c15a0006-korea3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decision-system:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch pinned injury / snap / player-stats releases and verify SHA-256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m decision_system.fetch

      - name: Unit and end-to-end tests on synthetic fixtures
        run: python -m pytest decision_system/tests -q

      - name: Compute the injury, depth and availability measurements
        run: python -m decision_system.injury_engine

      - name: Audit the settled strategies, correlations and parlay arithmetic
        run: python -m decision_system.strategies

      - name: Rebuild the 22-page decision dashboard
        run: python -m decision_system.build

      - name: Verify sources, blanks, links, anchors, drift and statistical identities
        run: python -m decision_system.check

      - name: Re-run every pre-existing gate on the combined tree
        run: |
          python3 line_lab/check_site.py
          python3 verify/source_audit.py --max-unsourced 0 --allow-dirs session-398c4b58,qa
          python3 verify/linkcheck_all.py
          python3 verification/link_audit.py
          python3 hub/check_hub.py
          python3 -m nfl_lab.check_verified
          python3 -m pytest tests/test_lab_*.py -q

      # The site is served by GitHub Pages from `main` at the repository root, so a
      # measurement that exists only as a workflow artifact is invisible to the reader.
      # This step publishes it.  It is idempotent: manifest_observed.json's checked_utc is
      # erased and result files carry no clock, so an unchanged night produces no diff and
      # no commit.
      - name: Publish the computed evidence back to the branch
        run: |
          python -c "import json,pathlib; p=pathlib.Path('data/injury_lab/manifest_observed.json'); b=json.loads(p.read_text()); b.pop('checked_utc', None); p.write_text(json.dumps(b, indent=1, sort_keys=True)+chr(10))"
          if [ -z "$(git status --porcelain data/injury_lab decision_system)" ]; then
            echo "no change: the published evidence already matches the computed evidence"
            exit 0
          fi
          git config user.name  "decision-system[bot]"
          git config user.email "decision-system@users.noreply.github.com"
          git add data/injury_lab decision_system/*.html decision_system/style.css
          git commit -m "Publish computed injury/depth evidence and rebuild the dashboard

           Generated by .github/workflows/decision-system.yml from the pinned releases.
           Every number on the decision pages is computed, not typed; this commit is the
           only path by which a computed value reaches the published site."
          git push

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-system-evidence
          path: |
            data/injury_lab/manifest_observed.json
            data/injury_lab/injury_results.json
            data/injury_lab/strategy_results.json
            data/injury_lab/decision_system_check.json
