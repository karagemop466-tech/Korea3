name: Origin lab

# origin_lab/ is the origination desk: the price-snapshot store, the verified results feed, the
# side-then-total-then-moneyline origination order, the fair/market/difference columns, the
# signal-versus-staking leaderboard, the replacement-depth join, the officially sourced correlations
# and the promotion and demotion gates.
#
# The build is deterministic: every stage is stdlib-only, needs no network, no clock and no
# randomness, so the committed HTML must be exactly reproducible from the committed data.
#
# check.py is fail-closed. It exits non-zero if a page is missing, if two consecutive builds differ,
# if a table row carries no source link, if an external link points at a host outside the source
# register, if the side/total identity fails on any row, if the 2026 feed stops reconciling to the
# league's own standings, if a headline number disagrees with a recomputation from the raw inputs, or
# if a value that must be blank (CLV, prop figures, capture timestamps) has been filled in.
#
# The job is named after the directory rather than "verify": four workflows in this repository
# already use the job name "verify", and `gh pr checks` lists job names, so a fifth would be
# untraceable without opening each run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild every stage and run the gate
        run: python3 origin_lab/run_all.py

      - name: Fail if generated output differs from committed output
        run: git diff --exit-code -- origin_lab/data origin_lab/*.html

      - name: Classify the source of every table row repository-wide
        # Rows in two other sessions' archives (session-398c4b58/, qa/) are non-numeric and are
        # reported on the site rather than excused; they are counted, not gated.
        run: python3 verify/source_audit.py --max-unsourced 0 --allow-dirs session-398c4b58,qa

      - name: Resolve every local link on every published page
        run: python3 verify/linkcheck_all.py
