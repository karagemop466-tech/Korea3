name: Official NFL research collection
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collector stage
        required: true
        default: probe
        type: choice
        options: [probe, collect]
permissions:
  contents: read
concurrency:
  group: official-nfl-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect public NFL publications
        run: python -m nfl_lab.ingest --mode "$MODE"
        env:
          MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-research-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
